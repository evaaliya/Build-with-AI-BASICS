<title>Moo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Rubik:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: phone-width app; painted meadow backdrop per view; floating glass controls over it. */
:root {
  --font-display: 'Rubik', system-ui, sans-serif;
  --font-body: 'Nunito', system-ui, sans-serif;
  --ink: #ffffff;
  --ink-soft: rgba(255, 255, 255, 0.86);
  --glass: rgba(16, 42, 28, 0.52);
  --glass-strong: rgba(10, 30, 20, 0.66);
  --glass-edge: rgba(255, 255, 255, 0.55);
  --glass-accent: rgba(122, 214, 84, 0.5);
  --nav-active: rgba(8, 26, 16, 0.62);
  --field: rgba(255, 255, 255, 0.2);
  --shadow: rgba(10, 30, 15, 0.38);
  --ok-bg: #d6f7c4; --ok-ink: #123d0e;
  --warn-bg: #ffd66b; --warn-ink: #4a3200;
  --bad-bg: #ff9a90; --bad-ink: #4a0f0b;
  --none-bg: rgba(255, 255, 255, 0.26); --none-ink: #ffffff;
  --bg-filter: none;
  --bg-tint: rgba(0, 0, 0, 0);
  --stars: 0;
  --map-filter: none;
  --page: #1f4630;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --glass: rgba(10, 16, 52, 0.58); --glass-strong: rgba(5, 9, 34, 0.76);
    --glass-edge: rgba(170, 190, 255, 0.42); --glass-accent: rgba(110, 132, 255, 0.55);
    --nav-active: rgba(3, 6, 28, 0.72); --field: rgba(160, 180, 255, 0.16); --shadow: rgba(0, 0, 20, 0.5);
    --bg-filter: brightness(0.4) saturate(0.8); --bg-tint: rgba(14, 22, 96, 0.4); --stars: 0.95;
    --map-filter: brightness(0.68) saturate(0.85); --page: #080d2b; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --glass: rgba(10, 16, 52, 0.58); --glass-strong: rgba(5, 9, 34, 0.76);
  --glass-edge: rgba(170, 190, 255, 0.42); --glass-accent: rgba(110, 132, 255, 0.55);
  --nav-active: rgba(3, 6, 28, 0.72); --field: rgba(160, 180, 255, 0.16); --shadow: rgba(0, 0, 20, 0.5);
  --bg-filter: brightness(0.4) saturate(0.8); --bg-tint: rgba(14, 22, 96, 0.4); --stars: 0.95;
  --map-filter: brightness(0.68) saturate(0.85); --page: #080d2b; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--page); color: var(--ink); font-family: var(--font-body); font-weight: 700; font-size: 16px; line-height: 1.35; transition: background .5s; -webkit-tap-highlight-color: transparent; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }

.stage { height: 100%; display: flex; justify-content: center; }
.phone { position: relative; width: 100%; max-width: 440px; height: 100%; overflow: hidden; isolation: isolate; background: var(--page); }
@media (min-width: 600px) {
  .stage { padding-block: 14px; }
  .phone { border-radius: 38px; border: 1px solid rgba(255, 255, 255, 0.3); box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45); }
}

/* painted backdrops */
.bgl { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0; transform: scale(1.1); filter: var(--bg-filter); transition: opacity .9s ease, transform 1.8s ease, filter .6s; z-index: 0; }
.bgl.on { opacity: 1; transform: scale(1); }
.scrim { position: absolute; inset: 0; z-index: 1; pointer-events: none; background: var(--bg-tint); transition: background .6s; }
.scrim::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,.22), rgba(0,0,0,0) 28%, rgba(0,0,0,0) 55%, rgba(0,0,0,.34)); }
.stars { position: absolute; inset: 0 0 45% 0; z-index: 1; pointer-events: none; opacity: var(--stars); transition: opacity .8s;
  background-image:
    radial-gradient(1.6px 1.6px at 12% 14%, #fff, transparent), radial-gradient(1.2px 1.2px at 27% 6%, #fff, transparent),
    radial-gradient(1.8px 1.8px at 41% 20%, #fff, transparent), radial-gradient(1.2px 1.2px at 58% 9%, #fff, transparent),
    radial-gradient(1.6px 1.6px at 72% 17%, #fff, transparent), radial-gradient(1.2px 1.2px at 86% 8%, #fff, transparent),
    radial-gradient(1.4px 1.4px at 93% 24%, #fff, transparent), radial-gradient(1.2px 1.2px at 6% 30%, #fff, transparent),
    radial-gradient(1.5px 1.5px at 64% 31%, #fff, transparent); animation: twinkle 4s ease-in-out infinite alternate; }
@keyframes twinkle { from { filter: brightness(.7); } to { filter: brightness(1.3); } }

/* glass */
.glass { background: linear-gradient(158deg, rgba(255,255,255,.24), rgba(255,255,255,0) 42%), var(--glass); -webkit-backdrop-filter: blur(22px) saturate(1.5); backdrop-filter: blur(22px) saturate(1.5); border: 1px solid var(--glass-edge); box-shadow: inset 0 1.5px 0 rgba(255,255,255,.55), inset 0 -1px 0 rgba(255,255,255,.14), 0 12px 30px var(--shadow); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 12px 18px; border-radius: 999px; font-weight: 800; font-size: 16px; text-shadow: 0 1px 2px rgba(0,0,0,.35); transition: transform .12s, background .3s; }
.btn:active { transform: scale(.96); }
.btn.go { background: linear-gradient(158deg, rgba(255,255,255,.34), rgba(255,255,255,0) 50%), var(--glass-accent); }
.btn.full { width: 100%; }
.btn.sm { min-height: 44px; padding: 8px 14px; font-size: 14.5px; }

/* top bar */
.top { position: absolute; z-index: 20; top: 0; left: 0; right: 0; display: flex; align-items: center; justify-content: space-between; padding: 14px max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); }
.topr { display: flex; align-items: center; gap: 10px; }
.brand { display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 18px 0 12px; border-radius: 999px; font-family: var(--font-display); font-weight: 700; font-size: 24px; letter-spacing: .01em; text-shadow: 0 1px 3px rgba(0,0,0,.4); }
.brand span { font-size: 24px; }
.avbtn { width: 46px; height: 46px; border-radius: 50%; padding: 0; display: grid; place-items: center; font-size: 24px; transition: transform .12s; }
.avbtn:active { transform: scale(.92); }

/* day-night switch */
.tgl { position: relative; width: 84px; height: 44px; padding: 0; border: 0; border-radius: 999px; background: #f1f2f6; box-shadow: inset 0 3px 7px rgba(80,92,130,.3), inset 0 -2px 4px #fff, 0 8px 18px rgba(0,0,0,.3); transition: background .45s, box-shadow .45s; }
.tgl[aria-checked="true"] { background: #151d6b; box-shadow: inset 0 3px 8px rgba(0,0,30,.6), inset 0 -2px 4px rgba(120,140,255,.18), 0 8px 18px rgba(0,0,0,.4); }
.knob { position: absolute; top: 4px; left: 4px; width: 36px; height: 36px; border-radius: 50%; background: #fff; box-shadow: 0 3px 8px rgba(60,70,110,.4); display: grid; place-items: center; transition: transform .45s cubic-bezier(.5,1.5,.5,1), background .45s; }
.tgl[aria-checked="true"] .knob { transform: translateX(40px); background: #2b3a96; box-shadow: 0 3px 8px rgba(0,0,30,.5); }
.knob svg { position: absolute; width: 32px; height: 32px; transition: opacity .35s, transform .45s; }
.knob .moon { opacity: 0; transform: rotate(-60deg) scale(.6); }
.tgl[aria-checked="true"] .sun { opacity: 0; transform: rotate(90deg) scale(.6); }
.tgl[aria-checked="true"] .moon { opacity: 1; transform: none; }

/* screens */
.scroller { position: absolute; inset: 0; z-index: 10; overflow-y: auto; overflow-x: hidden; padding: 80px max(16px, env(safe-area-inset-right, 0px)) 124px max(16px, env(safe-area-inset-left, 0px)); scrollbar-width: none; }
.scroller.chatmode { padding-bottom: 186px; }
.scroller::-webkit-scrollbar { display: none; }
.screen { display: flex; flex-direction: column; gap: 14px; animation: rise .5s ease both; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
h1, h2 { margin: 0; font-family: var(--font-display); text-shadow: 0 2px 8px rgba(0,0,0,.45); }
h1 { font-size: 28px; line-height: 1.15; font-weight: 700; text-wrap: balance; }
.sub { margin: 4px 0 0; font-size: 15px; color: var(--ink-soft); text-shadow: 0 1px 4px rgba(0,0,0,.5); }
.sec { font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; margin-top: 6px; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.card { border-radius: 26px; padding: 16px; }
.head { display: flex; align-items: center; gap: 12px; }
.head > div { min-width: 0; }
.back { flex: none; width: 46px; height: 46px; border-radius: 50%; padding: 0; display: grid; place-items: center; }

.scan { display: flex; align-items: center; gap: 14px; width: 100%; padding: 18px; border-radius: 30px; text-align: left; transition: transform .12s; }
.scan:active, .tile:active { transform: scale(.98); }
.scan .ic-wrap { flex: none; width: 62px; height: 62px; border-radius: 50%; display: grid; place-items: center; background: var(--glass-accent); box-shadow: inset 0 1.5px 0 rgba(255,255,255,.5); }
.scan b, .rank b, .tile b { display: block; font-family: var(--font-display); font-size: 20px; font-weight: 600; }
.scan small, .rank small, .tile small { display: block; margin-top: 2px; font-size: 14.5px; color: var(--ink-soft); }
.tile { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 14px; border-radius: 28px; text-align: left; transition: transform .12s; }
.tile b { font-size: 17px; }
.live { display: inline-block; width: 10px; height: 10px; margin-right: 6px; border-radius: 50%; background: #7be36a; box-shadow: 0 0 0 3px rgba(123,227,106,.35); }

.row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 26px; }
.av { flex: none; width: 50px; height: 50px; border-radius: 50%; display: grid; place-items: center; font-size: 27px; background: var(--glass-strong); box-shadow: inset 0 1px 0 rgba(255,255,255,.35); }
.meta { flex: 1; min-width: 0; }
.meta b { display: block; font-size: 17px; font-weight: 800; }
.meta small { display: block; font-size: 14px; color: var(--ink-soft); }
.chip { flex: none; max-width: 46%; padding: 6px 12px; border-radius: 999px; font-size: 13.5px; font-weight: 800; text-align: center; line-height: 1.2; }
.chip.ok { background: var(--ok-bg); color: var(--ok-ink); }
.chip.warn { background: var(--warn-bg); color: var(--warn-ink); }
.chip.bad { background: var(--bad-bg); color: var(--bad-ink); }
.chip.none { background: var(--none-bg); color: var(--none-ink); }
.pet { display: flex; flex-direction: column; gap: 12px; padding: 14px; border-radius: 28px; }
.pet .row { padding: 0; background: none; border: 0; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; }
.pet.flash { animation: flash 1.6s ease 2; }
@keyframes flash { 50% { box-shadow: 0 0 0 4px #fff, 0 12px 30px var(--shadow); } }

.rank { display: flex; align-items: center; gap: 14px; width: 100%; padding: 16px; border-radius: 28px; text-align: left; }
.rank .ic { margin-left: auto; opacity: .8; }
.hero-rank { flex-direction: column; align-items: stretch; gap: 12px; cursor: default; }
.hero-rank .top-line { display: flex; align-items: center; gap: 14px; }
.bar { height: 12px; border-radius: 999px; background: rgba(255,255,255,.2); overflow: hidden; box-shadow: inset 0 1px 3px rgba(0,0,0,.35); }
.bar i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #ffe27a, #f0a323); transition: width .6s cubic-bezier(.3,1.3,.5,1); }

.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.tro { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 16px 10px 14px; border-radius: 28px; text-align: center; animation: pop .5s cubic-bezier(.3,1.5,.5,1) both; }
.tro .cup { height: 70px; filter: drop-shadow(0 6px 8px rgba(0,0,0,.35)); animation: sway 4s ease-in-out infinite; }
.tro.lost .cup { filter: grayscale(1) brightness(.8) drop-shadow(0 4px 6px rgba(0,0,0,.35)); animation: none; opacity: .75; }
.tro b { font-size: 17px; font-weight: 800; }
.tro small { font-size: 13.5px; color: var(--ink-soft); }
.tro .chip { max-width: 100%; margin-top: 4px; }
.tro .btn { margin-top: 6px; }
@keyframes pop { from { opacity: 0; transform: scale(.7); } to { opacity: 1; transform: none; } }
@keyframes sway { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg) translateY(-2px); } }

.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.step { padding: 10px 6px; border-radius: 20px; text-align: center; font-size: 13.5px; line-height: 1.25; }
.step b { display: block; font-family: var(--font-display); font-size: 19px; }
.demo { display: flex; flex-direction: column; gap: 12px; }
.demo p { margin: 0; font-size: 15px; color: var(--ink-soft); }
.demo .btns { display: flex; gap: 10px; flex-wrap: wrap; }
.demo .btns .btn { flex: 1 1 130px; }

.mapbox { padding: 10px; border-radius: 30px; }
.mapsvg { display: block; width: 100%; height: auto; border-radius: 22px; filter: var(--map-filter); transition: filter .6s; }
.mapsvg text { font-family: var(--font-body); font-weight: 800; font-size: 11px; paint-order: stroke; stroke: rgba(0,0,0,.55); stroke-width: 3px; fill: #fff; }
.pulse { transform-box: fill-box; transform-origin: center; animation: pulse 1.8s ease-out infinite; }
@keyframes pulse { 0% { transform: scale(.5); opacity: .7; } 100% { transform: scale(1.6); opacity: 0; } }
.lockrow { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 26px; }
.lockrow p { margin: 0; flex: 1; min-width: 0; font-size: 15px; }
.dot { flex: none; width: 14px; height: 14px; border-radius: 50%; background: #ff4a3d; box-shadow: 0 0 0 4px rgba(255,74,61,.35); }

.me { display: flex; align-items: center; gap: 14px; }
.me .av { width: 64px; height: 64px; font-size: 32px; }
.field { width: 100%; min-height: 52px; padding: 0 18px; border-radius: 999px; border: 1px solid var(--glass-edge); background: var(--field); color: #fff; font-size: 16px; font-weight: 700; outline-offset: 2px; }
.field::placeholder { color: rgba(255,255,255,.72); }
.field.err { animation: shake .4s; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
form.vet { display: flex; flex-direction: column; gap: 10px; }

/* feed */
.fchips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 4px; scrollbar-width: none; }
.fchips::-webkit-scrollbar { display: none; }
.fc { flex: none; min-height: 44px; padding: 0 16px; border-radius: 999px; font-size: 15px; font-weight: 800; text-shadow: 0 1px 2px rgba(0,0,0,.35); transition: background .3s; }
.fc[aria-pressed="true"] { background: var(--nav-active); }
.post { display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; border-radius: 28px; }
.ph { display: flex; align-items: center; gap: 12px; }
.ph .av { width: 44px; height: 44px; font-size: 22px; }
.ph .meta b { font-size: 16px; }
.ptxt { margin: 0; font-size: 16.5px; line-height: 1.4; font-weight: 700; }
.pfoot { display: flex; align-items: center; gap: 10px; }
.like { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 999px; font-size: 15px; font-weight: 800; transition: transform .12s, background .3s; }
.like:active { transform: scale(.92); }
.like[aria-pressed="true"] { background: rgba(255, 110, 120, .55); }
.like[aria-pressed="true"] svg { fill: #fff; }
.cmt { display: inline-flex; align-items: center; gap: 8px; margin-left: auto; font-size: 15px; color: var(--ink-soft); }
.composer-card { display: flex; flex-direction: column; gap: 12px; padding: 14px; border-radius: 28px; }
.area { width: 100%; min-height: 96px; padding: 14px 16px; border-radius: 22px; border: 1px solid var(--glass-edge); background: var(--field); color: #fff; font-size: 16px; font-weight: 700; resize: vertical; }
.area::placeholder { color: rgba(255,255,255,.72); }

/* chat */
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 5px; border-radius: 999px; }
.seg button { min-height: 46px; border: 0; background: none; border-radius: 999px; font-weight: 800; font-size: 15.5px; text-shadow: 0 1px 2px rgba(0,0,0,.35); transition: background .3s; }
.seg button[aria-pressed="true"] { background: var(--nav-active); box-shadow: inset 0 1px 0 rgba(255,255,255,.3); }
.vethead { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 26px; }
.msgs { display: flex; flex-direction: column; gap: 8px; }
.msg { display: flex; flex-direction: column; gap: 3px; max-width: 84%; padding: 10px 14px; border-radius: 22px 22px 22px 6px; align-self: flex-start; background: linear-gradient(158deg, rgba(255,255,255,.2), rgba(255,255,255,0) 45%), var(--glass); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); border: 1px solid var(--glass-edge); box-shadow: 0 8px 20px var(--shadow); animation: pop .35s cubic-bezier(.3,1.5,.5,1) both; }
.msg.mine { align-self: flex-end; border-radius: 22px 22px 6px 22px; background: linear-gradient(158deg, rgba(255,255,255,.3), rgba(255,255,255,0) 50%), var(--glass-accent); }
.msg .who { font-size: 12.5px; font-weight: 800; color: var(--ink-soft); }
.msg .txt { font-size: 16px; line-height: 1.35; overflow-wrap: anywhere; }
.msg .time { align-self: flex-end; font-size: 11.5px; opacity: .78; }
.msg img { display: block; width: 100%; max-width: 240px; border-radius: 16px; margin-bottom: 2px; }
.typing { display: inline-flex; gap: 5px; padding: 4px 0; }
.typing i { width: 8px; height: 8px; border-radius: 50%; background: #fff; opacity: .5; animation: dots 1s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes dots { 40% { opacity: 1; transform: translateY(-3px); } }
.composer { position: absolute; z-index: 19; left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); bottom: 94px; display: flex; align-items: center; gap: 6px; padding: 6px; border-radius: 999px; }
.composer .field { flex: 1; min-width: 0; min-height: 48px; background: var(--field); }
.round { flex: none; width: 48px; height: 48px; border-radius: 50%; padding: 0; border: 1px solid var(--glass-edge); background: var(--field); display: grid; place-items: center; transition: transform .12s; }
.round:active { transform: scale(.9); }
.round.send { background: var(--glass-accent); }

/* camera */
.cam { padding: 10px; border-radius: 32px; }
.viewport { position: relative; aspect-ratio: 3 / 4; max-height: 56vh; width: 100%; overflow: hidden; border-radius: 24px; background: rgba(0,0,0,.4); display: grid; place-items: center; text-align: center; }
.viewport video, .viewport img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.guide { position: absolute; inset: 15% 12%; pointer-events: none; }
.guide i { position: absolute; width: 36px; height: 36px; border: 4px solid #fff; filter: drop-shadow(0 2px 4px rgba(0,0,0,.5)); }
.guide i:nth-child(1) { top: 0; left: 0; border-right: 0; border-bottom: 0; border-radius: 14px 0 0 0; }
.guide i:nth-child(2) { top: 0; right: 0; border-left: 0; border-bottom: 0; border-radius: 0 14px 0 0; }
.guide i:nth-child(3) { bottom: 0; left: 0; border-right: 0; border-top: 0; border-radius: 0 0 0 14px; }
.guide i:nth-child(4) { bottom: 0; right: 0; border-left: 0; border-top: 0; border-radius: 0 0 14px 0; }
.scanline { position: absolute; left: 12%; right: 12%; top: 15%; height: 4px; border-radius: 4px; background: linear-gradient(90deg, transparent, #9dff7a, transparent); box-shadow: 0 0 18px 4px rgba(157,255,122,.7); animation: sweep 1.3s ease-in-out infinite alternate; }
@keyframes sweep { to { top: 84%; } }
.camhint { position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 0 28px; font-size: 17px; text-shadow: 0 1px 4px rgba(0,0,0,.6); }
.camctl { display: flex; align-items: center; justify-content: space-around; padding: 4px 8px; }
.shutter { width: 80px; height: 80px; border-radius: 50%; border: 5px solid #fff; background: rgba(255,255,255,.82); box-shadow: 0 0 0 5px rgba(255,255,255,.25), 0 10px 22px var(--shadow); transition: transform .12s; }
.shutter:active { transform: scale(.9); }
.shutter:disabled { opacity: .5; }
.camctl .round { width: 58px; height: 58px; }
.spacer { width: 58px; }

/* nav */
.nav { position: absolute; z-index: 20; left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); bottom: 14px; display: grid; grid-template-columns: repeat(6, 1fr); gap: 0; padding: 6px; border-radius: 36px; }
.nav button { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 58px; padding: 6px 2px; border: 0; background: none; border-radius: 28px; font-size: 11px; font-weight: 800; text-shadow: 0 1px 2px rgba(0,0,0,.4); transition: background .3s, transform .15s; }
.nav button:active { transform: scale(.94); }
.nav button[aria-current="page"] { background: var(--nav-active); box-shadow: inset 0 1px 0 rgba(255,255,255,.3), inset 0 -1px 0 rgba(255,255,255,.08); }
.badge { position: absolute; top: 3px; right: calc(50% - 25px); min-width: 20px; height: 20px; padding: 0 5px; border-radius: 999px; background: #ffd66b; color: #4a3200; font-size: 12px; font-weight: 800; display: grid; place-items: center; text-shadow: none; }

/* rating */
.podium { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; align-items: end; padding-top: 4px; }

/* toasts and celebration */
.toasts { position: absolute; z-index: 40; top: 74px; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 8px; pointer-events: none; }

.cel { position: absolute; inset: 0; z-index: 50; display: grid; place-items: center; padding: 24px; background: rgba(0,10,5,.5); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); animation: fade .3s both; }

.confetti { position: absolute; top: -14px; width: 10px; height: 16px; border-radius: 3px; z-index: 51; pointer-events: none; animation: fall linear forwards; }

        <small style="color:var(--ink-soft);text-align:center">Демо: животное подбирается для показа, настоящее распознавание подключается отдельно.</small></div>`;
    }
    const busy = sc.phase === 'busy';
    return head('Найти животное', busy ? 'Ищу в вашем стаде…' : 'Наведи камеру на морду', 'home') +
      `<div class="glass cam"><div class="viewport">${view}<div class="guide"><i></i><i></i><i></i><i></i></div></div></div>
      <div class="camctl"><button class="glass round" data-act="gallery" aria-label="Выбрать из галереи">${ic('gallery', 26)}</button>
      <button class="shutter" data-act="shutter" aria-label="Сфотографировать" ${busy ? 'disabled' : ''}></button><span class="spacer"></span></div>${res}`;
  }

  function slotPost(p) {
    const s = slotById(p.slot);
    if (!s) return '';
    const booked = slotBooked(s), free = s.cap - booked, mine = myBookingFor(s), past = s.day < S.today;
    const pct = clamp(booked / s.cap * 100, 0, 100);
    const action = past ? '<span class="chip none" style="max-width:none">Приём прошёл</span>'
      : mine ? `<span class="chip ok" style="max-width:none">Вы записаны · № ${mine.q}</span>`
      : free > 0 ? `<button class="glass btn go full" data-act="book" data-s="${s.id}">${ic('cal', 22)}Записаться</button>`
      : '<span class="chip bad" style="max-width:none">Мест нет</span>';
    return `<article class="glass post slotc"><div class="ph"><span class="av" aria-hidden="true">🩺</span><span class="meta"><b>${esc(p.author)}</b><small>${p.time} · ветеринар</small></span><span class="chip warn">Приём</span></div>
      <div class="slotdate"><b>${dayLabel(s.day)}</b><span>${s.from}–${s.to}</span></div>
      <p class="ptxt">Вакцинация от ${s.disease}. ${esc(s.place)}. Привезите ветпаспорт.</p>
      <div class="cap${free <= 3 ? ' full' : ''}"><div class="bar"><i style="width:${pct}%"></i></div><small>Занято ${booked} из ${s.cap} · свободно ${free}</small></div>${action}</article>`;
  }
  function renderFeed() {
    const list = S.posts.filter((p) => S.filter === 'all' || p.cat === S.filter);
    const chips = [['all', 'Все'], ['slot', 'Приём'], ['news', 'Новости'], ['ads', 'Объявления'], ['ask', 'Вопросы']].map((c) =>
      `<button class="glass fc" data-filter="${c[0]}" aria-pressed="${S.filter === c[0]}">${c[1]}</button>`).join('');
    const comp = S.composing
      ? `<form class="glass composer-card" id="postForm" autocomplete="off"><div class="fchips">${Object.keys(CATS).map((k) => `<button type="button" class="glass fc" data-act="cat" data-c="${k}" aria-pressed="${S.draftCat === k}">${CATS[k]}</button>`).join('')}</div>
        <textarea class="area" id="postText" placeholder="Что у вас нового?" aria-label="Текст записи">${esc(S.draft)}</textarea>
        <div class="grid2"><button type="button" class="glass btn" data-act="compose">Отмена</button><button type="submit" class="glass btn go">Опубликовать</button></div></form>`
      : `<button class="glass btn go full" data-act="compose">${ic('plus', 22)}Написать в ленту</button>`;
    const posts = list.map((p) => p.slot ? slotPost(p) : `<article class="glass post"><div class="ph"><span class="av" aria-hidden="true">${p.sys ? '🐮' : p.vet ? '🩺' : esc(p.author.charAt(0))}</span>
      <span class="meta"><b>${esc(p.author)}</b><small>${p.time}${p.vet ? ' · ветеринар' : ''}</small></span><span class="chip none">${CATS[p.cat]}</span></div>
      <p class="ptxt">${esc(p.text)}</p>
      <div class="pfoot"><button class="glass like" data-like="${p.id}" aria-pressed="${!!p.liked}">${ic('heart', 20)}${p.likes}</button><span class="cmt">${ic('chat', 20)}${p.comments}</span></div></article>`).join('');
    return head('Лента села', 'Приём ветеринара, новости и объявления') + comp + `<div class="fchips">${chips}</div><div class="stack">${posts || '<div class="glass card">Пока здесь пусто.</div>'}</div>`;
  }

  /* ---------- chat (shared) ---------- */
  const QUICK = ['Корова не ест', 'Овца хромает', 'Записаться на прививку', 'Нужен осмотр'];
  const VQUICK = ['Записал вас на приём', 'Привезите ветпаспорт', 'Приеду после 16:00', 'Пришлите фото'];
  function msgHtml(m, other) {
    const mine = S.role === 'vet' ? m.vet === true : m.from === 'me';
    const who = m.from === 'me' ? (other || 'Айбек') : m.from;
    return `<div class="msg${mine ? ' mine' : ''}">${mine ? '' : `<span class="who">${esc(who)}${m.vet ? ' · ветеринар' : ''}</span>`}${m.img ? `<img src="${m.img}" alt="Фото">` : ''}${m.text ? `<span class="txt">${esc(m.text)}</span>` : ''}<span class="time">${m.t}</span></div>`;
  }
  function curThread() {
    if (S.role === 'vet') return S.vthread ? thr(S.vthread) : [];
    return S.thread === 'vet' ? thr('me') : S.msgs.village;
  }
  function msgsInner() {
    const other = S.role === 'vet' && S.vthread ? firstName(fById(S.vthread)) : '';
    return curThread().map((m) => msgHtml(m, other)).join('') + (S.typing && S.role === 'farmer' && S.thread === 'vet' ? '<div class="msg"><span class="typing"><i></i><i></i><i></i></span></div>' : '');

    const pin = vet && mb ? `<div class="glass row"><span class="qn sm">${mb.q}</span><span class="meta"><b>Моя запись · № ${mb.q}</b><small>${dayLabel(slotById(mb.slot).day)} · ${eta(slotById(mb.slot), mb.q)} · ${esc(slotById(mb.slot).place)}</small></span></div>` : '';
    return head('Чат', vet ? 'Личный разговор с ветеринаром' : 'Общий чат села Нижний-Чуй') +
      `<div class="glass seg"><button data-act="thread" data-th="village" aria-pressed="${!vet}">Село</button><button data-act="thread" data-th="vet" aria-pressed="${vet}">Ветеринар</button></div>` +
      (vet ? `<div class="glass vethead"><span class="av" aria-hidden="true">🩺</span><span class="meta"><b>Нурлан Асанов</b><small><i class="live"></i>отвечает в течение часа</small></span></div>${pin}
        <div class="fchips">${QUICK.map((q) => `<button class="glass fc" data-quick="${esc(q)}">${q}</button>`).join('')}</div>` : '') +
      `<div class="msgs" id="chatMsgs">${msgsInner()}</div>`;
  }

  /* ---------- map ---------- */
  function houseSvg(f, i) {
    const p = HOUSES[i];
    return { p: p, f: f };
  }
  function renderMap() {
    const vet = S.role === 'vet';
    const owners = {};
    farmers().forEach((f) => { owners[f.house] = f; });
    const pass = (f) => {
      const an = animalsOf(f);
      if (S.mf === 'all') return true;
      if (S.mf === 'bad') return an.some((a) => lvl(a) === 'overdue' || lvl(a) === 'never');
      if (S.mf === 'soon') return an.some((a) => lvl(a) === 'soon' || lvl(a) === 'urgent');
      if (S.mf === 'ok') return an.every((a) => lvl(a) === 'ok');
      if (S.mf === 'recent') return an.some((a) => a.due !== null && ago(a) >= 0 && ago(a) <= 7);
      return true;
    };
    let svg = `<svg class="mapsvg" viewBox="0 0 360 310" role="img" aria-label="Схема села с домами">
      <rect width="360" height="310" fill="#a9dc86"/>
      <rect x="14" y="140" width="96" height="62" rx="18" fill="#c9e88f"/><rect x="232" y="14" width="110" height="52" rx="18" fill="#8fd078"/>
      <rect x="248" y="226" width="96" height="62" rx="18" fill="#d6ec9a"/><rect x="24" y="14" width="80" height="40" rx="16" fill="#8fd078"/>
      <path d="M-10 226C70 196 120 262 200 226S320 176 380 196" fill="none" stroke="#7fc6f0" stroke-width="18" stroke-linecap="round"/>
      <path d="M-10 226C70 196 120 262 200 226S320 176 380 196" fill="none" stroke="#b9e3fa" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 14"/>
      <path d="M16 36L112 88 190 66 346 116M112 88L128 190 200 162" fill="none" stroke="#fff3d2" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>`;
    if (vet) svg += OUT.map((o) => `<circle cx="${o.x}" cy="${o.y}" r="26" fill="#ff4a3d" opacity=".22"/>`).join('');
    HOUSES.forEach((p, i) => {
      const f = owners[i];
      const w = vet && f ? worst(f) : null;
      const col = vet ? LV[w].col : '#e8794f';
      const dim = vet && f && !pass(f) ? ' opacity=".22"' : '';
      const sel = vet && S.msel === f.id;
      const bad = vet && (w === 'overdue' || w === 'never') && !dim;
      svg += `<g ${vet && f ? `data-house="${f.id}" role="button" tabindex="0" aria-label="${esc(f.name)}"` : ''} transform="translate(${p[0]} ${p[1]})"${dim}>
        ${bad ? '<circle class="pulse" r="20" fill="#ff4a3d" opacity=".4"/>' : ''}<circle r="22" fill="transparent"/>${sel ? '<circle r="19" fill="none" stroke="#fff" stroke-width="3"/>' : ''}
        <path d="M-9 0V10H9V0Z" fill="#fff"/><path d="M-12 1L0 -11 12 1Z" fill="${col}" stroke="${vet ? 'rgba(0,0,0,.35)' : 'none'}" stroke-width="1.2"/></g>`;
    });
    const m = HOUSES[ME.house];
    if (!vet) svg += `<circle cx="${m[0]}" cy="${m[1]}" r="19" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="5 5"/><text x="${m[0]}" y="${m[1] + 34}" text-anchor="middle">Мой дом</text>`;
    if (vet) svg += OUT.map((o) => `<g transform="translate(${o.x + 14} ${o.y - 16})"><circle r="7" fill="#ff4a3d" stroke="#fff" stroke-width="2.5"/></g>`).join('');
    svg += '</svg>';
    let below;
    if (!vet) {
      below = `<div class="glass lockrow">${ic('lock', 28)}<p>Статус прививок соседей и очаги болезней видит только ветеринар.</p></div>`;
    } else {
      const chips = [['all', 'Все'], ['bad', 'Просрочили'], ['soon', 'Скоро срок'], ['ok', 'Привиты'], ['recent', 'За 7 дней']].map((c) => `<button class="glass fc" data-act="mf" data-v="${c[0]}" aria-pressed="${S.mf === c[0]}">${c[1]}</button>`).join('');
      const legend = `<div class="glass card"><div class="legend">${Object.keys(LV).map((k) => `<span><i style="background:${LV[k].col}"></i>${LV[k].name}</span>`).join('')}<span><i style="background:#ff4a3d;outline:2px solid #fff"></i>Очаг болезни</span></div></div>`;
      let sel = '<div class="glass card"><small style="color:var(--ink-soft)">Нажми на дом, чтобы увидеть хозяина и его животных.</small></div>';
      if (S.msel) {
        const f = fById(S.msel), an = animalsOf(f), ok = an.filter((a) => a.due !== null && left(a) >= 0).length, k = worst(f);
        sel = `<div class="glass card stack"><div class="me"><span class="av" aria-hidden="true">${f.emoji}</span><span class="meta"><b>${esc(f.name)}</b><small>Привито ${ok} из ${an.length}</small></span><span class="chip ${status({ due: k === 'never' ? null : k === 'overdue' ? S.today - 1 : k === 'urgent' ? S.today + 3 : k === 'soon' ? S.today + 20 : S.today + 99 }).k}">${LV[k].name}</span></div>
          ${an.map((a) => `<div class="hw"><span class="em">${TYPE[a.type][1]}</span><span class="nm">${esc(a.name)}</span><span class="chip ${status(a).k}">${status(a).t}</span></div>`).join('')}
          <div class="grid2"><button class="glass btn sm" data-act="vwrite" data-f="${f.id}">${ic('chat', 20)}Написать</button><button class="glass btn sm go" data-act="vinvite" data-f="${f.id}">${ic('cal', 20)}На приём</button></div></div>`;
      }
      below = `<div class="fchips">${chips}</div>${legend}${sel}<h2 class="sec">Очаги болезней</h2><div class="stack">${OUT.map((o) => `<div class="glass row"><span class="dot"></span><span class="meta"><b>${o.d}</b><small>${o.s}</small></span><span class="chip bad">${o.c} ${o.c === 1 ? 'случай' : 'случая'}</span></div>`).join('')}</div>`;
    }
    return head('Карта села', vet ? 'Статус прививок по домам' : 'Дома жителей и пастбища') + `<div class="glass mapbox">${svg}</div>` + below;
  }

  /* ---------- rating / cups ---------- */
  function tabsHtml() {
    return `<div class="glass seg"><button data-go="rating" aria-pressed="${S.view === 'rating'}">Рейтинг</button><button data-go="rewards" aria-pressed="${S.view === 'rewards'}">Мои кубки</button></div>`;
  }
  function renderRewards() {
    const n = active().length, r = rankOf(n);
    const next = RANKS.slice().reverse().find((x) => x.min > n);
    const goal = next ? next.min : 5;
    const line = next ? `До «${next.title}» ещё ${next.min - n}` : 'Высшее звание получено';
    const earned = S.animals.filter((a) => a.earned).sort((a, b) => (left(b) >= 0) - (left(a) >= 0) || left(b) - left(a));
    const cards = earned.map((a) => {
      const l = left(a), lost = l < 0, st = status(a);
      return `<div class="glass tro${lost ? ' lost' : ''}">${cupSvg(70, lost)}<b>${TYPE[a.type][1]} ${esc(a.name)}</b><small>Прививка от ${DISEASE} · подряд: ${a.streak}</small>
        <span class="chip ${lost ? 'bad' : st.k}">${lost ? 'Кубок потерян' : st.k === 'ok' ? 'Ещё ' + l + ' ' + dn(l) : st.t}</span>
        ${lost ? `<button class="glass btn go sm" data-act="bookfirst" data-aid="${a.id}">Записаться</button>` : ''}</div>`;
    }).join('');
    return head('Мои кубки', 'Прививка вовремя — кубок в коллекцию') + tabsHtml() +
      `<div class="glass rank hero-rank"><div class="top-line">${cupSvg(62, false)}<span><b>${r.title}</b><small>Кубков: ${n} · ${line}</small></span></div>
      <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${goal}" aria-valuenow="${Math.min(n, goal)}"><i style="width:${Math.min(100, n / goal * 100)}%"></i></div></div>
      <div class="grid2">${cards}</div>
      <div class="glass card">Кубок даёт только прививка, которую подтвердил ветеринар на приёме.</div>
      <h2 class="sec">Три напоминания</h2><div class="steps"><div class="glass step"><b>30</b>дней до срока</div><div class="glass step"><b>7</b>дней до срока</div><div class="glass step"><b>1</b>день до срока</div></div>
      ${demoCard()}`;
  }
  function renderProfile() {
    const n = active().length, r = rankOf(n);
    return head('Профиль', 'Нижний-Чуй', 'home') +
      `<div class="glass card stack"><div class="me"><span class="av" aria-hidden="true">👨‍🌾</span><span class="meta"><b>${ME.name}</b><small>${r.title} · кубков: ${n}</small></span></div>
      <div class="tiles3"><div class="glass tl"><b>${S.animals.length}</b>животных</div><div class="glass tl"><b>${myPoints()}</b>очков</div><div class="glass tl"><b>${myPos()}</b>место</div></div></div>
      <div class="glass card">Ветеринар подтверждает прививки на приёме. Роль ветеринара назначается администратором, переключатель сверху нужен только для демо.</div>`;
  }
  function renderRating() {
    const week = S.period === 'week', key = week ? 'week' : 'all';
    const list = board(key), me = list.find((f) => f.me);
    const above = list[me.pos - 2];
    const gap = above ? Math.max(1, above[key] - me[key]) : 0;
    const goal = above ? 'до ' + above.pos + ' места ещё ' + pts(gap) : 'вы на первом месте, так держать';
    const pod = [list[1], list[0], list[2]].map((f, i) => `<div class="pod${f.me ? ' me' : ''}"><span class="av" aria-hidden="true">${f.emoji}</span>
      <b>${esc(f.name.split(' ')[0])}${f.me ? ' (вы)' : ''}</b><small>${pts(f[key])}</small><div class="glass pil" style="height:${[78, 108, 60][i]}px">${MEDAL[f.pos - 1]}</div></div>`).join('');
    const rows = list.slice(3).map((f) => `<div class="glass row rrow${f.me ? ' me' : ''}"><span class="pos">${f.pos}</span><span class="av" aria-hidden="true">${f.emoji}</span>
      <span class="meta"><b>${esc(f.name)}${f.me ? ' (вы)' : ''}</b><small>Привито ${f.animals} · кубков: ${f.cups}</small></span><span class="chip none pts">${f[key]}</span></div>`).join('');
    const soon = [['🌾', 'Кормёжка', '+10 в день'], ['🧹', 'Уборка в хлеву', '+15 в день'], ['🚿', 'Чистота и гигиена', '+10 в день'], ['💚', 'Осмотр и уход', '+20 в день']]
      .map((s) => `<div class="glass soon"><span class="av" aria-hidden="true">${s[0]}</span><b>${s[1]}</b><small>${s[2]}</small><span class="chip none">Скоро</span></div>`).join('');
    return head('Рейтинг села', 'Нижний-Чуй · чем активнее, тем выше') + tabsHtml() +
      `<div class="glass seg"><button data-act="period" data-p="week" aria-pressed="${week}">Неделя</button><button data-act="period" data-p="all" aria-pressed="${!week}">Всё время</button></div>
      <div class="glass rank"><span class="bigpos">${me.pos}</span><span><b>Ваше место</b><small>${pts(me[key])} · ${goal}</small></span></div>
      <div class="podium">${pod}</div><div class="stack">${rows}</div>
      <h2 class="sec">Как начисляются очки</h2>
      <div class="glass card stack"><div class="hw"><span class="chip ok">+${PT.vacc}</span><span>За прививку, подтверждённую ветеринаром</span></div>
        <div class="hw"><span class="chip ok">+${PT.streak}</span><span>За каждый год подряд без пропусков</span></div>
        <div class="hw"><span class="chip ok">+${PT.all}</span><span>Если привиты все ваши животные</span></div></div>
      <h2 class="sec">Скоро: задания на каждый день</h2><div class="grid2">${soon}</div>`;
  }

  /* ---------- renderers: vet ---------- */
  function renderVToday() {
    const st = stats();
    const slots = S.slots.slice().sort((a, b) => a.day - b.day);
    let s = slotById(S.vslot);
    if (!s && slots.length) { s = slots[0]; S.vslot = s.id; }
    const chips = slots.map((x) => `<button class="glass fc" data-act="vslot" data-s="${x.id}" aria-pressed="${s && x.id === s.id}">${dayLabel(x.day)}</button>`).join('') +
      `<button class="glass fc" data-act="newslot">${ic('plus', 18)} Открыть приём</button>`;
    let body = '';
    if (s) {
      const bks = slotBookings(s), booked = slotBooked(s), done = bks.filter((b) => b.status === 'done').reduce((n, b) => n + b.heads, 0);
      const rows = bks.map((b) => {
        const f = fById(b.fid), names = animalsOf(f).filter((a) => b.aids.indexOf(a.id) >= 0).map((a) => a.name).join(', ');
        const act = b.status === 'booked'
          ? `<div class="grid2"><button class="glass btn go sm" data-act="vdone" data-b="${b.id}">${ic('syr', 20)}Привит</button><button class="glass btn sm" data-act="vno" data-b="${b.id}">Не пришёл</button></div>`
          : '';
        const chip = b.status === 'done' ? '<span class="chip ok">Привит</span>' : b.status === 'no_show' ? '<span class="chip bad">Не пришёл</span>' : b.status === 'cancelled' ? '<span class="chip none">Отменил</span>' : `<span class="chip none">в очереди</span>`;
        return `<div class="glass vq"><div class="row"><span class="qn sm">${b.q}</span><span class="meta"><b>${esc(f.name)}${f.id === 'me' ? ' (демо)' : ''}</b><small>${b.heads} ${hd(b.heads)} · ${esc(names)}</small></span>${chip}</div>${act}</div>`;
      }).join('');
      body = `<div class="glass card stack"><div class="slotc"><div class="slotdate"><b>${dayLabel(s.day)}</b><span>${s.from}–${s.to}</span></div></div><small style="color:var(--ink-soft)">${esc(s.place)} · вакцинация от ${s.disease}</small>
        <div class="cap${slotFree(s) <= 3 ? ' full' : ''}"><div class="bar"><i style="width:${clamp(booked / s.cap * 100, 0, 100)}%"></i></div><small>Записано ${booked} из ${s.cap} · привито ${done} · свободно ${slotFree(s)}</small></div></div>
        <h2 class="sec">Очередь</h2><div class="stack">${rows || '<div class="glass card">Пока никто не записался. Приём уже виден в ленте.</div>'}</div>`;
    } else {
      body = `<div class="glass card stack">Приёмов пока нет. Открой приём, и он сам появится в ленте жителей.<button class="glass btn go full" data-act="newslot">${ic('plus', 22)}Открыть приём</button></div>`;
    }
    return `<div><h1>Здравствуйте, Нурлан</h1><p class="sub">Кабинет ветеринара · Нижний-Чуй</p></div>
      <div class="tiles3"><div class="glass tl"><b>${st.pct}%</b>привито</div><div class="glass tl"><b>${S.hist[6]}</b>привито сегодня</div><div class="glass tl"><b>${needFarmers().length}</b>ждут внимания</div></div>
      <div class="fchips">${chips}</div>${body}`;
  }

  function renderVCast() {

  function renderVStats() {
    const st = stats();
    const C = 2 * Math.PI * 54;
    const order = ['ok', 'soon', 'urgent', 'overdue', 'never'];
    const segsBar = order.map((k) => `<i style="width:${st.c[k] / st.total * 100}%;background:${LV[k].col}"></i>`).join('');
    const leg = order.map((k) => `<span><i style="background:${LV[k].col}"></i>${LV[k].name}: ${st.c[k]}</span>`).join('');
    const max = Math.max.apply(null, S.hist.concat([1]));
    const days = S.hist.map((v, i) => `<div><b>${v}</b><i style="height:${Math.max(4, v / max * 60)}px"></i>${new Date(BASE.getTime() + (S.today - 6 + i) * 864e5).toLocaleDateString('ru-RU', { weekday: 'short' })}</div>`).join('');
    const spec = st.byType.map((x) => `<div class="sp"><span class="lab">${TYPE[x.t][1]} ${TYPE[x.t][0]}</span><div class="bar"><i style="width:${x.pct}%"></i></div><span class="v">${x.pct}%</span></div>`).join('');
    const debt = farmers().map((f) => ({ f: f, n: animalsOf(f).filter((a) => lvl(a) === 'overdue' || lvl(a) === 'never').length })).filter((x) => x.n).sort((a, b) => b.n - a.n).slice(0, 4);
    const debtRows = debt.map((x) => `<div class="glass row"><span class="av" aria-hidden="true">${x.f.emoji}</span><span class="meta"><b>${esc(x.f.name)}</b><small>${x.n} ${pl(x.n, ['животное', 'животных', 'животных'])} без действующей прививки</small></span><button class="glass btn sm" data-act="vwrite" data-f="${x.f.id}" aria-label="Написать">${ic('chat', 20)}</button></div>`).join('');
    return head('Статистика села', 'Нижний-Чуй · ' + st.total + ' животных') +
      `<div class="glass card stack" style="align-items:center"><div class="ring"><svg width="150" height="150" viewBox="0 0 150 150" role="img" aria-label="Привито ${st.pct} процентов"><circle cx="75" cy="75" r="54" fill="none" stroke="rgba(255,255,255,.2)" stroke-width="14"/><circle cx="75" cy="75" r="54" fill="none" stroke="#7be36a" stroke-width="14" stroke-linecap="round" stroke-dasharray="${C * st.pct / 100} ${C}" transform="rotate(-90 75 75)"/></svg><b>${st.pct}%</b><small>привито</small></div>
        <small style="color:var(--ink-soft)">${st.vacc} из ${st.total} животных с действующей прививкой</small></div>
      <div class="glass card stack"><div class="stack-bar">${segsBar}</div><div class="legend">${leg}</div></div>
      <h2 class="sec">Прививок за 7 дней</h2><div class="glass card"><div class="bars7">${days}</div></div>
      <h2 class="sec">По видам скота</h2><div class="glass card stack">${spec}</div>
      <h2 class="sec">Кому написать в первую очередь</h2><div class="stack">${debtRows || '<div class="glass card">Все привиты.</div>'}</div>`;
  }

  /* ---------- sheets ---------- */
  function drawSheet() {
    const h = $('#sheetHost'), sh = S.sheet;
    if (!sh) { h.innerHTML = ''; return; }
    let inner = '';
    if (sh.t === 'book') {
      const s = slotById(sh.slot), booked = bookedAids();
      const picks = S.animals.map((a) => {
        const dis = booked.has(a.id), on = sh.sel.indexOf(a.id) >= 0;
        return `<button class="glass pick" data-act="pick" data-aid="${a.id}" aria-pressed="${on}" ${dis ? 'disabled' : ''}><span class="box">${ic('check', 18)}</span><span class="av" style="width:40px;height:40px;font-size:22px" aria-hidden="true">${TYPE[a.type][1]}</span><span class="meta"><b>${esc(a.name)}</b><small>${dis ? 'уже записана' : status(a).t}</small></span></button>`;
      }).join('');
      const n = sh.sel.length, free = slotFree(s), q = slotBooked(s) + 1;
      const ok = n > 0 && n <= free;
      inner = `<div class="head"><div style="flex:1"><h2>Запись на приём</h2><p class="sub">${dayLabel(s.day)} · ${s.from}–${s.to} · ${esc(s.place)}</p></div><button class="glass back btn" data-act="sheetclose" aria-label="Закрыть">${ic('x', 22)}</button></div>
        <div class="cap${free <= 3 ? ' full' : ''}"><div class="bar"><i style="width:${clamp(slotBooked(s) / s.cap * 100, 0, 100)}%"></i></div><small>Свободно ${free} из ${s.cap} мест</small></div>
        <h2 class="sec">Кого привести</h2><div class="stack">${picks}</div>
        <div class="info">${n ? `<b>${n} ${hd(n)}</b> · вы будете № ${q}, примерно в ${eta(s, q)}` : 'Выберите хотя бы одно животное'}${n > free ? '<br>Не хватает мест, выберите меньше' : ''}</div>
        <button class="glass btn go full" data-act="confirmbook" ${ok ? '' : 'disabled'}>${ic('check', 22)}Записаться</button>`;
    } else {
      const DAYS = [0, 1, 2, 3], TIMES = [['09:00', '13:00'], ['14:00', '17:00'], ['08:00', '12:00']], PLACES = ['Ферма №2', 'Площадь у школы', 'Ветпункт'];
      inner = `<div class="head"><div style="flex:1"><h2>Открыть приём</h2><p class="sub">Появится в ленте у всех жителей</p></div><button class="glass back btn" data-act="sheetclose" aria-label="Закрыть">${ic('x', 22)}</button></div>
        <h2 class="sec">День</h2><div class="fchips">${DAYS.map((d) => `<button class="glass fc" data-act="sl" data-k="day" data-v="${d}" aria-pressed="${sh.day === d}">${dayLabel(S.today + d)}</button>`).join('')}</div>
        <h2 class="sec">Время</h2><div class="fchips">${TIMES.map((t, i) => `<button class="glass fc" data-act="sl" data-k="time" data-v="${i}" aria-pressed="${sh.time === i}">${t[0]}–${t[1]}</button>`).join('')}</div>
        <h2 class="sec">Место</h2><div class="fchips">${PLACES.map((t, i) => `<button class="glass fc" data-act="sl" data-k="place" data-v="${i}" aria-pressed="${sh.place === i}">${t}</button>`).join('')}</div>
        <h2 class="sec">Сколько голов принимаю</h2><div class="stepper"><button class="glass round" data-act="slcap" data-v="-5" aria-label="Меньше">${ic('minus', 22)}</button><b>${sh.cap}</b><button class="glass round" data-act="slcap" data-v="5" aria-label="Больше">${ic('plus', 22)}</button></div>
        <button class="switch" data-act="sl" data-k="notify" role="switch" aria-checked="${sh.notify}"><span class="sw"></span><span>Написать тем, кому пора (${needFarmers().length})</span></button>
        <button class="glass btn go full" data-act="createslot">${ic('check', 22)}Опубликовать приём</button>`;
    }
    h.innerHTML = `<div class="sheet" data-act="sheetbg"><div class="glass card stack" role="dialog" aria-modal="true">${inner}</div></div>`;
  }
  function openBook(slotId, aid) {
    let s = slotId ? slotById(slotId) : openSlots()[0];
    if (!s) { toast('warn', 'Ветеринар ещё не открыл приём. Загляни позже', 'bell'); return; }
    const booked = bookedAids();
    const sel = aid ? (booked.has(aid) ? [] : [aid]) : S.animals.filter((a) => needs(a) && !booked.has(a.id)).map((a) => a.id);
    S.sheet = { t: 'book', slot: s.id, sel: sel };
    drawSheet();
  }

  /* ---------- nav / render ---------- */
  const scroller = $('#scroller');
  const RENDER = { home: renderHome, camera: renderCamera, feed: renderFeed, chat: renderChat, map: renderMap, rating: renderRating, rewards: renderRewards, profile: renderProfile, vtoday: renderVToday, vcast: renderVCast, vchats: renderVChats, vstats: renderVStats };
  function renderNav() {
    const nav = S.role === 'vet' ? NAV_V : NAV_F;
    const cur = S.view in NAV_OF ? NAV_OF[S.view] : S.view;
    $('#nav').innerHTML = nav.map((t) => {
      let b = 0;
      if (S.role === 'farmer') b = t.id === 'home' ? S.animals.filter((a) => lvl(a) === 'overdue' || lvl(a) === 'urgent').length : t.id === 'chat' ? S.unread : 0;
      else b = t.id === 'vchats' ? vunTotal() : 0;
      return `<button data-go="${t.id}"${t.id === cur ? ' aria-current="page"' : ''}>${ic(t.icon, 24)}${t.label}${b ? `<span class="badge">${b}</span>` : ''}</button>`;
    }).join('');
    const rb = $('#roleBtn');
    rb.innerHTML = S.role === 'vet' ? '<span class="e">🩺</span><span>Ветеринар<small>демо</small></span>' : '<span class="e">👨‍🌾</span><span>Фермер<small>демо</small></span>';
    rb.setAttribute('aria-label', 'Сменить роль. Сейчас: ' + (S.role === 'vet' ? 'ветеринар' : 'фермер'));
  }
  const composerOn = () => (S.role === 'farmer' && S.view === 'chat') || (S.role === 'vet' && S.view === 'vchats' && !!S.vthread);
  function renderAll(keep) {
    const y = scroller.scrollTop;
    scroller.innerHTML = `<section class="screen">${RENDER[S.view]()}</section>`;
    renderNav();
    scroller.scrollTop = keep ? y : 0;
    scroller.classList.toggle('chatmode', composerOn());
    if (S.view === 'camera') attachStream();
    if (composerOn() && !keep) scrollChat();
    if (S.focus) {
      const el = $('[data-aid="' + S.focus + '"]');
      if (el) { el.scrollIntoView({ block: 'center' }); el.classList.add('flash'); }
      S.focus = null;
    }
    if (S.sheet) drawSheet();
  }
  function scrollChat() { scroller.scrollTop = scroller.scrollHeight; }
  function refreshChat() { const el = $('#chatMsgs'); if (el) { el.innerHTML = msgsInner(); scrollChat(); } }
  function setBg(v) {
    const key = VIEW_BG[v];
    document.querySelectorAll('.bgl').forEach((l) => l.classList.toggle('on', l.dataset.bg === key));
  }
  function prepComposer() {
    $('#composer').hidden = !composerOn();
    $('#chatInput').placeholder = S.role === 'vet' ? 'Ответ жителю…' : S.thread === 'vet' ? 'Напишите ветеринару…' : 'Сообщение соседям…';
  }
  function go(v, o) {
    o = o || {};
    if (o.thread) S.thread = o.thread;
    if (o.focus) S.focus = o.focus;
    if (S.view === 'camera' && v !== 'camera') stopCamera();
    S.view = v;
    if (v === 'camera') { S.scan = { phase: 'idle', img: null, hit: null, conf: 0 }; startCamera(); }
    if (v === 'chat') S.unread = 0;
    if (v === 'vchats' && !o.keepThread) S.vthread = o.vthread || null;
    if (v === 'vchats' && S.vthread) S.vun[S.vthread] = 0;
    setBg(v); prepComposer();
    renderAll(false);
  }
  function setRole(r) {
    if (S.role === r) return;
    stopCamera();
    S.role = r; S.sheet = null; S.vthread = null; S.typing = false;
    S.view = r === 'vet' ? 'vtoday' : 'home';
    drawSheet(); setBg(S.view); prepComposer(); renderAll(false);
    toast('info', r === 'vet' ? 'Кабинет ветеринара (демо)' : 'Кабинет фермера (демо)', r === 'vet' ? 'shield' : 'home');
    if (r === 'farmer' && S.pending.length) setTimeout(showPending, 500);
  }

  /* ---------- camera ---------- */
  function startCamera() {
    if (S.stream || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
    try {
      navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false }).then((st) => {
        if (S.view !== 'camera') { st.getTracks().forEach((t) => t.stop()); return; }
        S.stream = st; renderAll(true);
      }).catch(() => {});
    } catch (e) {}
  }
  function stopCamera() { if (S.stream) { S.stream.getTracks().forEach((t) => t.stop()); S.stream = null; } }
  function attachStream() {
    const v = $('#camVideo');
    if (v && S.stream && !v.srcObject) { v.srcObject = S.stream; v.hidden = false; const p = v.play(); if (p && p.catch) p.catch(() => {}); }
  }
  function startScan(url, seed) {
    S.scan = { phase: 'busy', img: url, hit: null, conf: 0 };
    renderAll(true);
    setTimeout(() => {
      if (S.view !== 'camera' || S.scan.img !== url) return;
      S.scan.phase = 'done';
      S.scan.hit = S.animals[Math.abs(seed) % S.animals.length].id;
      S.scan.conf = 90 + Math.abs(seed) % 9;
      renderAll(true);
      toast('good', 'Животное найдено: ' + S.animals.find((a) => a.id === S.scan.hit).name, 'check');
    }, 1800);
  }
  function shutter() {
    const v = $('#camVideo');
    if (S.stream && v && v.videoWidth) {
      try {
        const c = document.createElement('canvas');
        c.width = v.videoWidth; c.height = v.videoHeight;
        c.getContext('2d').drawImage(v, 0, 0);
        c.toBlob((b) => { if (b) startScan(URL.createObjectURL(b), b.size); }, 'image/jpeg', 0.85);
        return;
      } catch (e) {}
    }
    $('#camFile').click();
  }
  $('#camFile').addEventListener('change', (e) => {
    const f = e.target.files && e.target.files[0];
    e.target.value = '';
    if (f) startScan(URL.createObjectURL(f), f.size);
  });

  /* ---------- toasts, celebration ---------- */
  function toast(kind, text, icon) {
    const box = $('#toasts');
    const el = document.createElement('div');
    el.className = 'toast ' + kind;
    el.innerHTML = `<span class="ti">${ic(icon || 'bell', 20)}</span><span>${esc(text)}</span>`;
    box.appendChild(el);
    while (box.children.length > 3) box.removeChild(box.firstChild);
    setTimeout(() => el.classList.add('out'), 4800);
    setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); }, 5400);
  }
  function showPending() {
    const items = S.pending.splice(0);
    if (!items.length) return;
    const names = [].concat.apply([], items.map((i) => i.names)).join(', ');
    const renewed = items.every((i) => i.renewed), gain = items.reduce((n, i) => n + i.gain, 0);
    const p0 = items[0].p0, p1 = items[items.length - 1].p1, r = rankOf(active().length);
    const host = $('#celHost');
    host.innerHTML = `<div class="cel"><div class="glass card">${cupSvg(112, false, 'big')}<h2>${renewed ? 'Кубок продлён!' : 'Новый кубок!'}</h2>
      <p>Ветеринар подтвердил прививку: ${esc(names)}</p><p><b>+${pts(gain)}</b> · звание: ${r.title}</p>${p1 < p0 ? '<p>Рейтинг: ' + p0 + ' → ' + p1 + ' место</p>' : ''}
      <button class="glass btn go full" data-act="close-cel" style="margin-top:10px">Отлично</button></div></div>`;
    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      const colors = ['#ffd24a', '#8be36a', '#7cc4ee', '#ff8d85', '#ffffff'];
      for (let i = 0; i < 26; i++) {
        const c = document.createElement('i');
        c.className = 'confetti';
        c.style.left = Math.random() * 100 + '%';
        c.style.background = colors[i % colors.length];
        c.style.animationDuration = (1.6 + Math.random() * 1.6) + 's';
        c.style.animationDelay = (Math.random() * 0.5) + 's';
        host.appendChild(c);
        setTimeout(() => { if (c.parentNode) c.parentNode.removeChild(c); }, 3800);
      }
    }
  }

  /* ---------- logic ---------- */
  function confirmBook() {
    const sh = S.sheet, s = slotById(sh.slot);
    if (!sh.sel.length || sh.sel.length > slotFree(s)) return;
    const b = addBooking('me', sh.sel.slice(), s.id);
    S.sheet = null; drawSheet();
    thr('me').push({ from: 'Нурлан', vet: true, text: 'Записал вас: ' + dayLabel(s.day).toLowerCase() + ', ' + s.from + ', ' + s.place + '. Ваш номер ' + b.q + ', примерно в ' + eta(s, b.q) + '. Возьмите ветпаспорт.', t: hhmm() });
    S.unread++;
    renderAll(true);
    toast('good', 'Вы записаны, номер ' + b.q + '. Напомним за день', 'check');
  }
  function vDone(id) {
    const b = S.bookings.find((x) => x.id === id);
    if (!b || b.status !== 'booked') return;
    const f = fById(b.fid), list = animalsOf(f).filter((a) => b.aids.indexOf(a.id) >= 0);
    const p0 = myPos(), pt0 = myPoints();
    const wasAny = list.map((a) => a.earned && left(a) >= 0);
    list.forEach((a) => {
      if (b.fid === 'me') { a.streak = a.earned && left(a) >= 0 ? a.streak + 1 : 1; a.earned = true; a.stage = 0; a.lostShown = false; }
      a.due = S.today + 365;
    });
    b.status = 'done';
    S.hist[S.hist.length - 1] += b.heads;
    if (b.fid === 'me') {
      S.pending.push({ names: list.map((a) => a.name), renewed: wasAny.every(Boolean), p0: p0, p1: myPos(), gain: myPoints() - pt0 });
      thr('me').push({ from: 'Нурлан', vet: true, text: 'Прививка подтверждена: ' + list.map((a) => a.name).join(', ') + '. Кубок ваш!', t: hhmm() });
      S.unread++;
    }
    renderAll(true);
    toast('good', 'Привит: ' + f.name.split(' ')[0] + ', ' + b.heads + ' ' + hd(b.heads) + (b.fid === 'me' ? '. Фермер получит кубок' : ''), 'syr');
  }
  function vNo(id) {
    const b = S.bookings.find((x) => x.id === id);
    if (!b || b.status !== 'booked') return;
    b.status = 'no_show';
    if (b.fid === 'me') { thr('me').push({ from: 'Нурлан', vet: true, text: 'Вы не пришли на приём, запись снята. Запишитесь снова в ленте.', t: hhmm() }); S.unread++; }
    renderAll(true);
    toast('info', 'Место освобождено', 'x');
  }
  function sendCast() {
    const c = S.cast, list = segFarmers(c.seg);
    const ta = $('#castText'); if (ta) c.text = ta.value;
    if (!c.text.trim()) { toast('warn', 'Напишите текст', 'bell'); return; }
    list.forEach((f) => vetSay(f.id, c.text.split('{имя}').join(firstName(f))));
    if (c.post) S.posts.unshift({ id: S.nid++, author: 'Нурлан Асанов', vet: true, cat: 'news', text: c.text.split('{имя}, ').join('').split('{имя}').join(''), time: 'только что', likes: 0, liked: false, comments: 0 });
    renderAll(true);
    toast('good', 'Отправлено: ' + list.length + ' ' + pl(list.length, ['жителю', 'жителям', 'жителям']) + (c.post ? ' и в ленту' : ''), 'send');
  }
  function createSlot() {
    const sh = S.sheet;
    const TIMES = [['09:00', '13:00'], ['14:00', '17:00'], ['08:00', '12:00']], PLACES = ['Ферма №2', 'Площадь у школы', 'Ветпункт'];
    const s = { id: S.nid++, day: S.today + sh.day, from: TIMES[sh.time][0], to: TIMES[sh.time][1], place: PLACES[sh.place], disease: DISEASE, cap: sh.cap };
    S.slots.push(s);
    S.posts.unshift({ id: S.nid++, slot: s.id, author: 'Нурлан Асанов', vet: true, cat: 'slot', time: 'только что', likes: 0, comments: 0 });
    let n = 0;
    if (sh.notify) { const l = needFarmers(); n = l.length; l.forEach((f) => vetSay(f.id, 'Открыт приём: ' + dayLabel(s.day).toLowerCase() + ', ' + s.from + ', ' + s.place + '. Записывайтесь в ленте, места ограничены.')); }
    S.vslot = s.id; S.sheet = null; drawSheet();
    renderAll(true);
    toast('good', 'Приём опубликован в ленте' + (n ? ', написали ' + n + ' жителям' : ''), 'mega');
  }
  function tick(days) {
    const p0 = myPos();
    S.today += days;
    for (let i = 0; i < days; i++) { S.hist.push(0); S.hist.shift(); }
    const ev = [];
    S.animals.forEach((a) => {
      if (!a.earned) return;
      const l = left(a);
      if (l < 0) {
        if (!a.lostShown) { a.lostShown = true; ev.push(['bad', 'Кубок за ' + a.name + ' потерян: срок прививки вышел', 'broken']); }
      } else {
        const st = l <= 1 ? 3 : l <= 7 ? 2 : l <= 30 ? 1 : 0;
        if (st > a.stage) {
          a.stage = st;
          ev.push(['warn', st === 3 ? a.name + ': последний день! Иначе кубок пропадёт' : st === 2 ? a.name + ': осталась неделя. Запишись на приём' : a.name + ': прививка через ' + l + ' ' + dn(l) + '. Не потеряй кубок!', 'bell']);
        }
      }
    });
    const p1 = myPos();
    if (p1 > p0) ev.push(['warn', 'Вы опустились на ' + p1 + ' место в рейтинге', 'cup']);
    renderAll(true);
    if (!ev.length) toast('info', 'Прошло ' + days + ' ' + dn(days) + '. Всё спокойно', 'clock');
    ev.forEach((e, i) => setTimeout(() => toast(e[0], e[1], e[2]), i * 600));
  }

  /* ---------- chat logic ---------- */
  function vetReply(text, hasImg) {
    const t = text.toLowerCase();
    if (/привив|вакцин|ящур|записат/.test(t)) return 'Приём открыт в ленте. Нажмите «Записаться» у нужного дня и выберите животных.';
    if (/не ест|аппетит|жвачк/.test(t)) return 'Понял. Измерьте температуру и посмотрите, есть ли жвачка. Если животное не ест больше суток, пришлите фото, и я приеду сегодня.';
    if (/хром|копыт|нога/.test(t)) return 'Осмотрите копыто: нет ли раны или застрявшего камня. Пришлите фото, подскажу, что делать.';
    if (/осмотр|приехать|приед/.test(t)) return 'Могу заехать сегодня после 16:00. Напишите, какое животное и что вас беспокоит.';
    if (hasImg) return 'Фото получил. Посмотрю и отвечу в течение часа. Если животное вялое, сразу звоните.';
    return 'Принял. Какое животное, как давно это началось и есть ли температура?';
  }
  const NEIGHBOR = [['Бакыт', 'Понял, спасибо!'], ['Гульнара', 'Хорошая мысль, поддерживаю.'], ['Бакыт', 'Если что, звоните, помогу.']];
  function sendMsg(text, img) {
    text = (text || '').trim();
    if (!text && !img) return;
    if (S.role === 'vet') {
      if (!S.vthread) return;
      thr(S.vthread).push({ from: 'Нурлан', vet: true, text: text, img: img || null, t: hhmm() });
      if (S.vthread === 'me') S.unread++;
      refreshChat(); renderNav();
      return;
    }
    if (S.thread === 'vet') {
      thr('me').push({ from: 'me', text: text, img: img || null, t: hhmm() });
      S.vun.me = (S.vun.me || 0) + 1;
      S.typing = true; refreshChat();
      setTimeout(() => {
        S.typing = false;
        thr('me').push({ from: 'Нурлан', vet: true, text: vetReply(text, !!img), t: hhmm() });
        if (S.role === 'farmer' && S.view === 'chat' && S.thread === 'vet') refreshChat(); else { S.unread++; renderNav(); }
      }, 1700);
    } else {
      S.msgs.village.push({ from: 'me', text: text, img: img || null, t: hhmm() });
      refreshChat();
      const n = NEIGHBOR[S.villageIdx++ % NEIGHBOR.length];
      setTimeout(() => { S.msgs.village.push({ from: n[0], text: n[1], t: hhmm() }); if (S.role === 'farmer' && S.view === 'chat' && S.thread === 'village') refreshChat(); }, 1500);
    }
  }
  $('#clipBtn').innerHTML = ic('clip', 22);
  $('#sendBtn').innerHTML = ic('send', 22);
  $('#chatFile').addEventListener('change', (e) => {
    const f = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!f) return;
    const inp = $('#chatInput');
    const txt = inp.value; inp.value = '';
    sendMsg(txt, URL.createObjectURL(f));
  });

  /* ---------- events ---------- */
  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-go],[data-act],[data-like],[data-filter],[data-quick],[data-house],#roleBtn');
    if (!t) return;
    if (t.id === 'roleBtn') return setRole(S.role === 'vet' ? 'farmer' : 'vet');
    const d = t.dataset;
    if (d.go) return go(d.go, { thread: d.th });
    if (d.house) { S.msel = S.msel === d.house ? null : d.house; return renderAll(true); }
    if (d.like) {
      const p = S.posts.find((x) => x.id === parseInt(d.like, 10));
      if (p) { p.liked = !p.liked; p.likes += p.liked ? 1 : -1; renderAll(true); }
      return;
    }
    if (d.filter) { S.filter = d.filter; return renderAll(true); }
    if (d.quick) return sendMsg(d.quick);
    const sh = S.sheet;
    switch (d.act) {
      case 'time7': tick(7); break;
      case 'reset': reset(); S.view = 'home'; setBg('home'); prepComposer(); renderAll(false); toast('info', 'Демо началось сначала', 'clock'); break;
      case 'close-cel': $('#celHost').innerHTML = ''; break;
      case 'shutter': shutter(); break;
      case 'gallery': $('#camFile').removeAttribute('capture'); $('#camFile').click(); setTimeout(() => $('#camFile').setAttribute('capture', 'environment'), 500); break;
      case 'rescan': S.scan = { phase: 'idle', img: null, hit: null, conf: 0 }; renderAll(true); startCamera(); break;
      case 'openanimal': go('home', { focus: d.aid }); break;
      case 'thread': S.thread = d.th; S.unread = 0; prepComposer(); renderAll(false); break;
      case 'attach': $('#chatFile').click(); break;
      case 'compose': S.composing = !S.composing; renderAll(true); break;
      case 'cat': S.draftCat = d.c; renderAll(true); break;
      case 'period': S.period = d.p; renderAll(true); break;
      case 'bookfirst': openBook(null, d.aid); break;
      case 'book': openBook(parseInt(d.s, 10)); break;
      case 'pick': { const i = sh.sel.indexOf(d.aid); if (i >= 0) sh.sel.splice(i, 1); else sh.sel.push(d.aid); drawSheet(); break; }
      case 'confirmbook': confirmBook(); break;
      case 'sheetclose': S.sheet = null; drawSheet(); break;
      case 'sheetbg': if (e.target === t) { S.sheet = null; drawSheet(); } break;
      case 'cancelbook': { const b = S.bookings.find((x) => x.id === parseInt(d.b, 10)); if (b) { b.status = 'cancelled'; renderAll(true); toast('info', 'Запись отменена', 'x'); } break; }
      case 'vslot': S.vslot = parseInt(d.s, 10); renderAll(true); break;
      case 'newslot': S.sheet = { t: 'slot', day: 1, time: 0, place: 0, cap: 30, notify: true }; drawSheet(); break;
      case 'sl': if (d.k === 'notify') sh.notify = !sh.notify; else sh[d.k] = parseInt(d.v, 10); drawSheet(); break;
      case 'slcap': sh.cap = clamp(sh.cap + parseInt(d.v, 10), 5, 60); drawSheet(); break;
      case 'createslot': createSlot(); break;
      case 'vdone': vDone(parseInt(d.b, 10)); break;
      case 'vno': vNo(parseInt(d.b, 10)); break;
      case 'mf': S.mf = d.v; renderAll(true); break;
      case 'vwrite': go('vchats', { vthread: d.f }); thr(d.f); break;
      case 'vinvite': {
        const s = openSlots()[0];
        if (!s) { toast('warn', 'Сначала открой приём', 'bell'); break; }
        const f = fById(d.f);
        vetSay(d.f, firstName(f) + ', приглашаю на приём: ' + dayLabel(s.day).toLowerCase() + ', ' + s.from + ', ' + s.place + '. Запишитесь в ленте.');
        toast('good', 'Приглашение отправлено: ' + firstName(f), 'send');
        break;
      }
      case 'vopen': go('vchats', { vthread: d.f }); break;
      case 'vback': S.vthread = null; prepComposer(); renderAll(false); break;
      case 'seg': S.cast.seg = d.v; S.cast.text = TPL[d.v]; renderAll(true); break;
      case 'castpost': { const ta = $('#castText'); if (ta) S.cast.text = ta.value; S.cast.post = !S.cast.post; renderAll(true); break; }
      case 'castsend': sendCast(); break;
    }
  });
  document.addEventListener('input', (e) => {
    if (e.target.id === 'postText') S.draft = e.target.value;
    if (e.target.id === 'castText') S.cast.text = e.target.value;
  });
  document.addEventListener('submit', (e) => {
    const id = e.target.id;
    if (id === 'postForm') {
      e.preventDefault();
      const txt = $('#postText').value.trim();
      if (!txt) { toast('warn', 'Напишите текст записи', 'bell'); return; }
      S.posts.unshift({ id: S.nid++, author: ME.name, cat: S.draftCat, text: txt, time: 'только что', likes: 0, liked: false, comments: 0 });
      S.composing = false; S.draft = ''; S.filter = 'all';
      renderAll(false); toast('good', 'Запись опубликована в ленте', 'check');
    } else if (id === 'composer') {
      e.preventDefault();
      const inp = $('#chatInput');
      sendMsg(inp.value); inp.value = '';
    }
  });

  /* ---------- theme ---------- */
  const root = document.documentElement, themeBtn = $('#themeBtn');
  const isDark = () => { const t = root.getAttribute('data-theme'); return t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches; };
  const syncSwitch = () => themeBtn.setAttribute('aria-checked', isDark() ? 'true' : 'false');
  try { const saved = localStorage.getItem('moo_theme'); if (saved === 'dark' || saved === 'light') root.setAttribute('data-theme', saved); } catch (err) {}
  themeBtn.addEventListener('click', () => {
    const next = isDark() ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('moo_theme', next); } catch (err) {}
    syncSwitch();
  });
  new MutationObserver(syncSwitch).observe(root, { attributes: true, attributeFilter: ['data-theme'] });
  try { window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', syncSwitch); } catch (err) {}

  /* ---------- boot ---------- */
  reset();
  $('#bgs').innerHTML = Object.keys(BGS).map((k) => `<div class="bgl${k === VIEW_BG[S.view] ? ' on' : ''}" data-bg="${k}" style="background-image:url('${BGS[k]}')"></div>`).join('');
  syncSwitch(); prepComposer(); renderAll(false);
})();
</script>
