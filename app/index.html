<!doctype html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f4630">
  <meta name="claude:viewport-fit-sides" content="cover">
  <title>Moo</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="stylesheet" href="styles.css?v=35">
  <script defer src="supabase-config.js?v=5"></script>
  <script>
    // Recursion guard: if index.html is loaded inside an iframe (SW fallback bug),
    // render nothing so the map never mirrors the whole app.
    window.__MOO_NESTED__ = window.top !== window.self;
    if (window.__MOO_NESTED__) {
      document.write('<!doctype html><title></title><body style="margin:0;background:transparent"></body>');
    }
  </script>
</head>
<body>
<svg class="defs" aria-hidden="true"><defs>
  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe88a"/><stop offset="1" stop-color="#f0a323"/></linearGradient>
</defs></svg>

<div class="stage">
  <div class="phone" id="phone">
    <div id="bgs" aria-hidden="true"></div>
    <div class="scrim"></div>
    <div class="stars"></div>

    <div class="top">
      <div class="glass brand"><span aria-hidden="true">🐄</span>Moo</div>
      <div class="topr">
        <button id="langBtn" class="glass langbtn" type="button" data-i18n-aria="language" aria-label="Language">RU</button>
        <button id="authBtn" class="glass langbtn authbtn" type="button" hidden></button>
        <button id="roleBtn" class="glass rolebtn" type="button" hidden aria-label="Role"></button>
        <button id="themeBtn" class="tgl" type="button" role="switch" aria-checked="false" data-i18n-aria="toggleTheme" aria-label="Night mode">
          <span class="knob">
            <svg class="sun" viewBox="0 0 32 32" aria-hidden="true">
              <g stroke="#f7b500" stroke-width="2.4" stroke-linecap="round"><path d="M16 3.5v3M16 25.5v3M3.5 16h3M25.5 16h3M7.2 7.2l2.1 2.1M22.7 22.7l2.1 2.1M7.2 24.8l2.1-2.1M22.7 9.3l2.1-2.1"/></g>
              <circle cx="16" cy="16" r="6.4" fill="#ffe36b" stroke="#f7b500" stroke-width="1.6"/>
            </svg>
            <svg class="moon" viewBox="0 0 32 32" aria-hidden="true">
              <path d="M20.5 5.5a11 11 0 1 0 6 18.2A9 9 0 0 1 20.5 5.5Z" fill="#fff"/>
              <g fill="#fff"><path d="M26 6l.8 2 2 .8-2 .8L26 11.6l-.8-2-2-.8 2-.8Z"/><circle cx="7" cy="8" r="1"/><circle cx="25" cy="17" r=".9"/><circle cx="9" cy="25" r=".9"/></g>
            </svg>
          </span>
        </button>
      </div>
    </div>

    <main class="scroller" id="scroller"></main>

    <form class="glass composer" id="composer" autocomplete="off" hidden>
      <button type="button" class="round" data-act="attach" aria-label="Attach" id="clipBtn"></button>
      <input class="field" id="chatInput" type="text" data-i18n-ph="typeMessage" placeholder="…" aria-label="Message">
      <button type="submit" class="round send" aria-label="Send" id="sendBtn"></button>
    </form>

    <div class="cam-bar" id="camBar" hidden></div>

    <nav class="glass nav" id="nav" aria-label="Nav" hidden></nav>
    <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
    <div id="sheetHost"></div>
    <div id="celHost"></div>
    <input type="file" id="chatFile" accept="image/*" hidden>
    <input type="file" id="camFile" accept="image/*" capture="environment" hidden>
  </div>
</div>

<script type="module" src="app.js?v=35"></script>
</body>
</html>
