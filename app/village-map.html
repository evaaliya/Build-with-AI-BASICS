function Layer(color,y){
  const pos=[];
  const L={
    tri(a,b,c){const cr=(b[1]-a[1])*(c[0]-a[0])-(b[0]-a[0])*(c[1]-a[1]);if(cr<0){const t=b;b=c;c=t}
      pos.push(a[0],y,a[1],b[0],y,b[1],c[0],y,c[1])},
    disc(c,r){const n=10;for(let i=0;i<n;i++){const a=i/n*6.2832,b=(i+1)/n*6.2832;
      L.tri(c,[c[0]+Math.cos(a)*r,c[1]+Math.sin(a)*r],[c[0]+Math.cos(b)*r,c[1]+Math.sin(b)*r])}},
    ribbon(p,w){const h=w/2;
      for(let i=0;i<p.length-1;i++){const a=p[i],b=p[i+1],dx=b[0]-a[0],dz=b[1]-a[1],l=Math.hypot(dx,dz);if(l<1e-6)continue;
        const nx=-dz/l*h,nz=dx/l*h;
        const A=[a[0]+nx,a[1]+nz],B=[a[0]-nx,a[1]-nz],C=[b[0]+nx,b[1]+nz],E=[b[0]-nx,b[1]-nz];
        L.tri(A,B,C);L.tri(B,E,C)}
      p.forEach(q=>L.disc(q,h))},
    build(){const g=new THREE.BufferGeometry();
      g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
      const nrm=new Float32Array(pos.length);for(let i=1;i<nrm.length;i+=3)nrm[i]=1;
      g.setAttribute('normal',new THREE.BufferAttribute(nrm,3));
      const m=new THREE.Mesh(g,M(color));m.receiveShadow=true;scene.add(m)}
  };return L;
}

 {const cr=new THREE.Mesh(new THREE.CylinderGeometry(.3,.3,.06,10),M('#d9638f'));cr.position.set(-.4,.2,.72);cr.castShadow=true;g.add(cr)}
 // качалка-балансир
 gbox(g,.8,.05,.12,'#4fb6e8',.1,.2,-.8).rotation.z=.18;gbox(g,.08,.18,.08,'#ffffff',.1,.1,-.8);
}

const HASH=new Map();
function hadd(x,z,r){const k=Math.floor(x/3)+','+Math.floor(z/3);if(!HASH.has(k))HASH.set(k,[]);HASH.get(k).push([x,z,r])}
D.b.forEach(b=>{const [cx,cz,w,d,ph]=b,r=Math.max(w/2*1.15+.4,.9);
  if(d>4){for(let o=-d/2;o<=d/2;o+=2)hadd(cx+Math.sin(ph)*o,cz+Math.cos(ph)*o,r)}else hadd(cx,cz,Math.max(w,d)/2*1.15+.4)});
function samp(p,hw){for(let i=0;i<p.length-1;i++){const a=p[i],b=p[i+1],l=Math.hypot(b[0]-a[0],b[1]-a[1]),n=Math.max(1,Math.floor(l/.7));for(let j=0;j<=n;j++)hadd(a[0]+(b[0]-a[0])*j/n,a[1]+(b[1]-a[1])*j/n,hw)}}
D.r.forEach(r=>samp(r.p,RW[r.c]/2+.5));D.w.forEach(w=>samp(w.p,(w.k==='river'?2.5:.6)+.9));
NEW.exb.forEach(e=>hadd(e[0],e[1],e[2]));
function blocked(x,z){if(Math.abs(x)>HX-2||Math.abs(z)>HZ-2)return true;const cx=Math.floor(x/3),cz=Math.floor(z/3);
  for(let i=-1;i<=1;i++)for(let j=-1;j<=1;j++){const a=HASH.get((cx+i)+','+(cz+j));if(a)for(const q of a)if((q[0]-x)**2+(q[1]-z)**2<q[2]*q[2])return true}return false}
const sheep=[];
{let tries=0;
 while(sheep.length<26&&tries++<4000){
  const b=D.b[Math.floor(R()*D.b.length)],x=b[0]+(R()-.5)*30,z=b[1]+(R()-.5)*30;
  if(blocked(x,z))continue;
  const g=new THREE.Group();
  const sb=(w,h,d,c,x,y,z)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(c));m.position.set(x,y,z);m.castShadow=true;g.add(m)};
  sb(.6,.4,.4,'#ffffff',0,.5,0);sb(.22,.24,.22,'#3b3b3b',.38,.62,0);
  [[-.2,-.13],[-.2,.13],[.2,-.13],[.2,.13]].forEach(l=>sb(.07,.25,.07,'#3b3b3b',l[0],.12,l[1]));
  scene.add(g);sheep.push({g,x,z,tx:x,tz:z,ph:R()*6.28,wait:R()*3});
 }}

// метка «я здесь» и след
const pin=new THREE.Group();
{const s=new THREE.Mesh(new THREE.SphereGeometry(.7,12,10),M('#ff5a36'));s.position.y=2.2;s.castShadow=true;
 const c=new THREE.Mesh(new THREE.ConeGeometry(.5,1.4,8),M('#ff5a36'));c.rotation.x=Math.PI;c.position.y=1.1;
 const w=new THREE.Mesh(new THREE.SphereGeometry(.28,10,8),M('#ffffff'));w.position.set(0,2.3,.55);
 pin.add(s,c,w);pin.visible=false;scene.add(pin)}
const dots=new THREE.InstancedMesh(new THREE.CylinderGeometry(.28,.28,.06,10),new THREE.MeshLambertMaterial({color:0xff5a36}),3000);
dots.count=0;scene.add(dots);
const me={x:0,z:0,ok:false};
const toScene=(lon,lat)=>[(lon-D.lon0)*D.kx,-(lat-D.lat0)*D.kz];
// очаги болезней + статусы домов: только через moo:overlay с role:'vet' (фермеру статусы не шлём)
const outbreakGroup=new THREE.Group();scene.add(outbreakGroup);
const houseOverlayGroup=new THREE.Group();scene.add(houseOverlayGroup);
const STATUS_COL={ok:0x6fdc5a,soon:0xffd24a,urgent:0xff9a3d,overdue:0xff4a3d,never:0xcfd8dc};
const outbreakLabels=[];
function clearOutbreaks(){
  while(outbreakGroup.children.length)outbreakGroup.remove(outbreakGroup.children[0]);
  outbreakLabels.forEach(el=>{try{el.remove()}catch(_){}});outbreakLabels.length=0;
}
function overlayXZ(o){
  // Prefer scene coords (sx/sz) when provided — lands exactly on building centroids.
  if(o.sx!=null&&o.sz!=null)return [o.sx,o.sz];
  if(o.lng!=null&&o.lat!=null)return toScene(o.lng,o.lat);
  if(o.x!=null&&o.y!=null)return toScene(D.lon0+(o.x-180)/D.kx*0.02,D.lat0-(o.y-155)/D.kz*0.02);
  return null;
}
function setOutbreaks(list){
  clearOutbreaks();
  (Array.isArray(list)?list:[]).forEach(o=>{
    const xz=overlayXZ(o);if(!xz)return;
    const [x,z]=xz;
    const R0=typeof o.radius==='number'?o.radius:2.4;
    const g=new THREE.Group();g.position.set(x,BY,z);
    const zone=new THREE.Mesh(new THREE.CircleGeometry(R0,28),
      new THREE.MeshBasicMaterial({color:0xff4a3d,transparent:true,opacity:.22,side:THREE.DoubleSide}));
    zone.rotation.x=-Math.PI/2;zone.position.y=.03;g.add(zone);
    const ring=new THREE.Mesh(new THREE.RingGeometry(Math.max(.45,R0*.55),Math.max(.7,R0*.85),28),
      new THREE.MeshBasicMaterial({color:0xff4a3d,transparent:true,opacity:.55,side:THREE.DoubleSide}));
    ring.rotation.x=-Math.PI/2;ring.position.y=.04;g.add(ring);
    const pole=new THREE.Mesh(new THREE.CylinderGeometry(.09,.09,1.7,8),M('#ff4a3d'));
    pole.position.y=.85;pole.castShadow=true;g.add(pole);
    const cap=new THREE.Mesh(new THREE.SphereGeometry(.28,12,10),M('#ff4a3d'));
    cap.position.y=1.8;cap.castShadow=true;g.add(cap);
    g.userData.ring=ring;outbreakGroup.add(g);
    if(o.disease){
      // Disease string may already include " · N" from the parent — avoid double cases.
      const lab=document.createElement('div');lab.className='tag sub';
      lab.textContent=/·/.test(String(o.disease))?String(o.disease):(o.disease+(o.cases?' · '+o.cases:''));
      lab.style.pointerEvents='none';document.body.appendChild(lab);
      outbreakLabels.push(lab);g.userData.label=lab;g.userData.labelY=3.4;
    }
  });
}
function clearHouseOverlays(){while(houseOverlayGroup.children.length)houseOverlayGroup.remove(houseOverlayGroup.children[0])}
function setHouseOverlays(houses){
  clearHouseOverlays();
  (Array.isArray(houses)?houses:[]).forEach(h=>{
    const xz=overlayXZ(h);if(!xz)return;
    const [x,z]=xz;
    const col=STATUS_COL[h.status]||STATUS_COL.never;
    const g=new THREE.Group();g.position.set(x,BY,z);g.userData.houseId=h.id;
    // Roof-height marker (above ordinary house wall+roof ≈ 2.0–2.6 above BY)
    const marker=new THREE.Mesh(new THREE.SphereGeometry(.5,12,10),new THREE.MeshBasicMaterial({color:col}));
    marker.position.y=typeof h.roofY==='number'?h.roofY:2.55;g.add(marker);
    if(h.status==='never'||h.status==='overdue'){
      const outline=new THREE.Mesh(new THREE.RingGeometry(.55,.78,20),
        new THREE.MeshBasicMaterial({color:0xff4a3d,side:THREE.DoubleSide,transparent:true,opacity:.9}));
      outline.rotation.x=-Math.PI/2;outline.position.y=.06;g.add(outline);
    }
    if(h.dim){marker.material.opacity=.25;marker.material.transparent=true}
    houseOverlayGroup.add(g);
  });
}
function applyOverlay(m){
  // Farmers: never apply status/outbreak data even if somehow present
  if(!m||m.role!=='vet'){clearOutbreaks();clearHouseOverlays();window.__mooOverlay=null;return}
  setHouseOverlays(m.houses||[]);
  setOutbreaks(m.outbreaks||[]);
  // Debug snapshot for e2e (scene positions after placement)
  window.__mooOverlay={
    role:m.role,
    houses:(m.houses||[]).map(h=>{const xz=overlayXZ(h);return{id:h.id,status:h.status,x:xz&&xz[0],z:xz&&xz[1],sx:h.sx,sz:h.sz}}),
    outbreaks:(m.outbreaks||[]).map(o=>{const xz=overlayXZ(o);return{id:o.id,disease:o.disease,x:xz&&xz[0],z:xz&&xz[1],sx:o.sx,sz:o.sz}}),
  };
}
function onFix(lon,lat){
  const [x,z]=toScene(lon,lat);if(Math.abs(x)>HX||Math.abs(z)>HZ)return;
  pin.position.set(x,BY,z);pin.visible=true;me.x=x;me.z=z;me.ok=true;meBtn.hidden=false;
  if(dots.count<3000){mA.compose(V3.set(x,BY+.03,z),Q.identity(),ONE);dots.setMatrixAt(dots.count++,mA);dots.instanceMatrix.needsUpdate=true}
}
window.trackPoint=onFix;
function allowedOrigin(o){
  try{return !o||o==='null'||o===location.origin||o===location.protocol+'//'+location.host}catch(_){return true}
}
// мост: moo:overlay | outbreaks (legacy) | gps | focus
function onMsg(e){
  if(!allowedOrigin(e.origin))return;
  let m=e.data;if(typeof m==='string'){try{m=JSON.parse(m)}catch(_){return}}
  if(!m||typeof m!=='object')return;
  if(m.type==='gps')onFix(m.lon,m.lat);
  if(m.type==='outbreaks'){/* legacy — only if list non-empty treated as vet */setOutbreaks(m.list)}
  if(m.type==='moo:overlay')applyOverlay(m);
  if(m.type==='focus'){const [x,z]=toScene(m.lon,m.lat);goal.x=x;goal.z=z;goal.zoom=m.zoom||3}
}
addEventListener('message',onMsg);document.addEventListener('message',onMsg);
try{!/nogps/.test(location.search)&&navigator.geolocation&&navigator.geolocation.watchPosition(p=>onFix(p.coords.longitude,p.coords.latitude),()=>{},{enableHighAccuracy:true})}catch(e){}

// подписи
const tags=D.lab.map(l=>{
  const b=document.createElement('button');b.className='tag'+(l.main?'':' sub');b.textContent=l.n;
  b.onclick=()=>{goal.x=l.x;goal.z=l.z;goal.zoom=l.main?2:3.5};document.body.appendChild(b);return b});

// камера и управление
const EL=.83,SIN=EL/Math.hypot(1,EL);
let ang=Math.PI/4+(calm?0:1.4),angGoal=Math.PI/4,zoom=.9,hhCur=55,hwCur=55;
const c0=D.lab[0],goal={x:c0.x,z:c0.z,zoom:1.4},tgt=new THREE.Vector3(c0.x,0,c0.z);
const meBtn=document.getElementById('me');
document.getElementById('reset').onclick=()=>{goal.x=c0.x;goal.z=c0.z;goal.zoom=.45};
document.getElementById('rot').onclick=()=>{angGoal+=Math.PI/2};
meBtn.onclick=()=>{if(me.ok){goal.x=me.x;goal.z=me.z;goal.zoom=3}};
function resize(){const w=innerWidth,h=innerHeight,a=w/h;let hh=55,hw=hh*a;if(hw<55){hw=55;hh=hw/a}
  hhCur=hh;hwCur=hw;Object.assign(cam,{left:-hw,right:hw,top:hh,bottom:-hh});cam.updateProjectionMatrix();renderer.setSize(w,h)}
addEventListener('resize',resize);resize();

const ptr=new Map(),cv=renderer.domElement;let pinch=null;
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,[e.clientX,e.clientY]);pinch=null});
const up=e=>{ptr.delete(e.pointerId);pinch=null};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('pointermove',e=>{
  if(!ptr.has(e.pointerId))return;
  const p=ptr.get(e.pointerId);
  if(ptr.size===1){
    const dx=e.clientX-p[0],dy=e.clientY-p[1];
    if(e.buttons===2||e.shiftKey){angGoal-=dx*.007;ang-=dx*.007}
    else{const upp=(2*hhCur/zoom)/innerHeight,sa=Math.sin(ang),ca=Math.cos(ang);
      goal.x-=sa*dx*upp;goal.z-=-ca*dx*upp;
      goal.x+=-ca*dy*upp/SIN;goal.z+=-sa*dy*upp/SIN;
      goal.x=Math.max(-HX,Math.min(HX,goal.x));goal.z=Math.max(-HZ,Math.min(HZ,goal.z))}
    ptr.set(e.pointerId,[e.clientX,e.clientY]);
  }else{
    ptr.set(e.pointerId,[e.clientX,e.clientY]);
    const [a,b]=[...ptr.values()],dd=Math.hypot(a[0]-b[0],a[1]-b[1]),an=Math.atan2(b[1]-a[1],b[0]-a[0]);
    if(pinch){goal.zoom=Math.min(6,Math.max(.3,goal.zoom*dd/pinch.d));zoom=goal.zoom;const da=an-pinch.a;ang-=da;angGoal-=da}
    pinch={d:dd,a:an};
  }
});
cv.addEventListener('wheel',e=>{e.preventDefault();goal.zoom=Math.min(6,Math.max(.3,goal.zoom*(e.deltaY<0?1.12:.89)))},{passive:false});

// tap house overlay → parent app opens house sheet
let _tapX=0,_tapY=0;
cv.addEventListener('pointerdown',e=>{_tapX=e.clientX;_tapY=e.clientY},{capture:true});
cv.addEventListener('pointerup',e=>{
  if(Math.hypot(e.clientX-_tapX,e.clientY-_tapY)>12)return;
  if(!houseOverlayGroup.children.length)return;
  const rect=cv.getBoundingClientRect();
  const nx=((e.clientX-rect.left)/rect.width)*2-1,ny=-((e.clientY-rect.top)/rect.height)*2+1;
  const ray=new THREE.Raycaster();ray.setFromCamera({x:nx,y:ny},cam);
  const hits=ray.intersectObjects(houseOverlayGroup.children,true);
  if(!hits.length)return;
  let g=hits[0].object;while(g&&g.userData.houseId==null&&g.parent)g=g.parent;
  if(g&&g.userData.houseId!=null){
    const msg={type:'moo:house-click',id:g.userData.houseId};
    try{parent.postMessage(msg,location.origin)}catch(_){try{parent.postMessage(msg,'*')}catch(__){}}
  }
});

const clock=new THREE.Clock(),v3=new THREE.Vector3();
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime,m=calm?0:1;
  ang+=(angGoal-ang)*Math.min(1,dt*(t<2.5?1.2:6));
  zoom+=(goal.zoom-zoom)*Math.min(1,dt*6);
  const k=Math.min(1,dt*8);tgt.x+=(goal.x-tgt.x)*k;tgt.z+=(goal.z-tgt.z)*k;
  cam.zoom=zoom;cam.updateProjectionMatrix();
  const ca=Math.cos(ang),sa=Math.sin(ang);
  cam.position.set(tgt.x+ca*200,EL*200,tgt.z+sa*200);cam.lookAt(tgt.x,0,tgt.z);
  // тени следуют за камерой
  const half=Math.max(30,Math.min(230,Math.hypot(hwCur,hhCur/SIN)/zoom*1.05)),sc=sun.shadow.camera;
  sc.left=-half;sc.right=half;sc.top=half;sc.bottom=-half;sc.updateProjectionMatrix();
  sun.target.position.copy(tgt);sun.position.set(tgt.x-66,tgt.y+120,tgt.z+48);
  // телега
  const cp=D.cp;
  if(cp.length>2){
    ci+=cdir*dt*14*m;if(ci>=cp.length-2){ci=cp.length-2;cdir=-1}if(ci<=0){ci=0;cdir=1}
    const i0=Math.floor(ci),p0=cp[i0],p1=cp[i0+1];
    cart.position.set(p0[0],BY,p0[1]);cart.rotation.y=-Math.atan2(p1[1]-p0[1],p1[0]-p0[0])+(cdir<0?Math.PI:0);
  }
  clouds.forEach(c=>{c.position.x+=dt*1.5*m;if(c.position.x>HX+40)c.position.x=-HX-40});
  sheep.forEach(s=>{
    const dx=s.tx-s.x,dz=s.tz-s.z,d=Math.hypot(dx,dz);
    if(d<.15){s.wait-=dt;if(s.wait<=0){const nx=s.x+(R()-.5)*14,nz=s.z+(R()-.5)*14;if(!blocked(nx,nz)&&!blocked((nx+s.x)/2,(nz+s.z)/2)){s.tx=nx;s.tz=nz}s.wait=1+R()*3}}
    else if(m){const sp=Math.min(d,dt*1.4),nx=s.x+dx/d*sp,nz=s.z+dz/d*sp;if(blocked(nx,nz)){s.tx=s.x;s.tz=s.z}else{s.x=nx;s.z=nz;s.g.rotation.y=-Math.atan2(dz,dx)}}
    s.g.position.set(s.x,1.04+(d>.15&&m?Math.abs(Math.sin(t*8+s.ph))*.06:0),s.z);
  });
  if(pin.visible)pin.position.y=BY+Math.abs(Math.sin(t*3))*.25*m;
  outbreakGroup.children.forEach((g,i)=>{
    const s=1+Math.sin(t*3+i)*.18;if(g.userData.ring)g.userData.ring.scale.set(s,s,s);
    if(g.userData.label){
      v3.set(g.position.x,g.userData.labelY||3.4,g.position.z).project(cam);
      const st=g.userData.label.style;
      // Clamp so Cyrillic tags are never cut off at the phone edge
      const pad=14;
      let lx=(v3.x*.5+.5)*innerWidth, ly=(-v3.y*.5+.5)*innerHeight;
      lx=Math.max(pad,Math.min(innerWidth-pad,lx));
      ly=Math.max(pad+10,Math.min(innerHeight-pad,ly));
      st.left=lx+'px';st.top=ly+'px';
      st.display=v3.z<1?'':'none';
    }
  });
  // подписи
  D.lab.forEach((l,i)=>{
    v3.set(l.x,l.main?7:4,l.z).project(cam);
    const s=tags[i].style;
    s.left=(v3.x*.5+.5)*innerWidth+'px';s.top=(-v3.y*.5+.5)*innerHeight+'px';
    s.display=l.main||zoom>1.2?'':'none';
  });
  renderer.render(scene,cam);
}
loop();
